# Pull requests that change diagram code (.arch files): check each diagram, and comment with
# what changed (items, lines, Terraform) so the architecture is reviewed with the code.
name: Diagram review

on:
  pull_request:
    paths: ["**/*.arch"]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check and compare the changed diagrams
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          : > comment.md
          status=0
          for f in $(git diff --name-only --diff-filter=AMRD "$BASE" HEAD -- '*.arch'); do
            before=/dev/null; after=/dev/null
            git cat-file -e "$BASE:$f" 2>/dev/null && before="$BASE:$f"
            [ -f "$f" ] && after="$f"
            if [ "$after" != /dev/null ] && ! npm run -s arch -- check "$f" 2> errors.txt; then
              status=1
              { echo "### \`$f\`"; echo; echo '```'; cat errors.txt; echo '```'; echo; } >> comment.md
              continue
            fi
            npm run -s arch -- diff --markdown "$before" "$after" >> comment.md
          done
          { echo "## ArchCanvas diagram review"; echo; cat comment.md; } > body.md
          echo "status=$status" >> "$GITHUB_ENV"
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file body.md --edit-last --create-if-none
      - name: Fail on diagram errors
        if: env.status == '1'
        run: exit 1
