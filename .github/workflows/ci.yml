# Tests, type checks, and `terraform validate` on the Terraform Keelrail generates for the
# sample diagram and every template (Google Cloud and AWS).
name: CI

on:
  push:
    branches: [main, "milestone-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - name: Generate Terraform from the sample and templates
        run: node node_modules/tsx/dist/cli.mjs scripts/terraform-fixtures.mts terraform-fixtures
      - name: terraform validate
        run: |
          set -euo pipefail
          while read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color > /dev/null
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done < terraform-fixtures/roots.txt
