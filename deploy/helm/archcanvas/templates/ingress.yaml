{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "archcanvas.fullname" . }}
  labels: {{- include "archcanvas.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Web pods' nginx proxies /api and /collab to the internal services,
          # so a single path works on every ingress controller (GCE, nginx, OpenShift).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "archcanvas.fullname" . }}-web
                port: { name: http }
{{- end }}
{{- if .Values.gke.managedCertificate }}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ include "archcanvas.fullname" . }}-cert
spec:
  domains: [{{ .Values.ingress.host }}]
{{- end }}
