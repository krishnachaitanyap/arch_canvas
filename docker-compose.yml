# Self-hosted / local stack: docker compose up -d --build  →  http://localhost:8000
# For production self-hosting on Kubernetes use deploy/helm/archcanvas instead.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archcanvas
      POSTGRES_PASSWORD: archcanvas
      POSTGRES_DB: archcanvas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archcanvas"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.api }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://archcanvas:archcanvas@postgres:5432/archcanvas
      PORT: "8080"
    depends_on:
      postgres: { condition: service_healthy }

  collab:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.collab }
    environment:
      DATABASE_URL: postgres://archcanvas:archcanvas@postgres:5432/archcanvas
    depends_on: [api]

  web:
    build: { context: ., dockerfile: deploy/docker/Dockerfile.web }
    ports: ["8000:8080"]
    depends_on: [api, collab]

  # --- Optional: identity provider for SSO. Enable with: docker compose --profile sso up -d
  keycloak:
    profiles: [sso]
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8081:8080"]

  # --- Optional: local LLM for air-gapped installs. Enable with: docker compose --profile local-llm up -d
  # Then set LLM_PROVIDER=openai_compatible, OPENAI_BASE_URL=http://ollama:11434/v1, LLM_MODEL=<model>
  ollama:
    profiles: [local-llm]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
